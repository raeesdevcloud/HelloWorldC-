name: Build-CI

trigger:
- my-work

variables:
  - group: Internship-Raees

stages:
  - stage: Build
    jobs:
      - job: BuildAndPublish
        displayName: 'Build and Publish'
        pool:
          name: Default
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 8 SDK'
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore Packages'
            inputs:
              command: 'restore'
              projects: '**/HelloWorld.sln'

          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '**/HelloWorld.sln'
              arguments: '--configuration Release'

          - task: DotNetCoreCLI@2
            displayName: 'Publish'
            inputs:
              command: 'publish'
              projects: '**/HelloWorld.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
              publishWebProjects: false
              zipAfterPublish: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'HelloWorld'
              publishLocation: 'Container'

  - stage: DeployDev
    displayName: 'Deploy to Dev'
    dependsOn: Build
    condition: succeeded('Build')
    jobs:
      - deployment: DeployAppDev
        displayName: 'Deploy Application to Dev'
        pool:
          name: Default
        environment: 'Dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Build Artifacts'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'HelloWorld'
                    downloadPath: '$(Pipeline.Workspace)'

                - task: CopyFiles@2
                  displayName: 'Deploy to Dev Directory'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/HelloWorld'
                    Contents: '**'
                    TargetFolder: '$(DevTargetPath)'
                    CleanTargetFolder: true

  - stage: DeployQAT
    displayName: 'Deploy to QAT'
    dependsOn: DeployDev
    condition: succeeded('DeployDev')
    jobs:
      - deployment: DeployAppQAT
        displayName: 'Deploy Application to QAT'
        pool:
          name: Default
        environment: 'QAT'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Build Artifacts'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'HelloWorld'
                    downloadPath: '$(Pipeline.Workspace)'

                - task: CopyFiles@2
                  displayName: 'Deploy to QAT Directory'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/HelloWorld'
                    Contents: '**'
                    TargetFolder: '$(QATTargetPath)'
                    CleanTargetFolder: true

  - stage: DeployUAT
    displayName: 'Deploy to UAT'
    dependsOn: DeployQAT
    condition: succeeded('DeployQAT')
    jobs:
      - deployment: DeployAppUAT
        displayName: 'Deploy Application to UAT'
        pool:
          name: Default
        environment: 'UAT'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Build Artifacts'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'HelloWorld'
                    downloadPath: '$(Pipeline.Workspace)'

                - task: CopyFiles@2
                  displayName: 'Deploy to UAT Directory'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/HelloWorld'
                    Contents: '**'
                    TargetFolder: '$(UATTargetPath)'
                    CleanTargetFolder: true

  - stage: DeployPreProd
    displayName: 'Deploy to Pre-Production'
    dependsOn: DeployUAT
    condition: succeeded('DeployUAT')
    jobs:
      - deployment: DeployAppPreProd
        displayName: 'Deploy Application to Pre-Production'
        pool:
          name: Default
        environment: 'PreProd'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Build Artifacts'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'HelloWorld'
                    downloadPath: '$(Pipeline.Workspace)'

                - task: CopyFiles@2
                  displayName: 'Deploy to Pre-Production Directory'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/HelloWorld'
                    Contents: '**'
                    TargetFolder: '$(PreProdTargetPath)'
                    CleanTargetFolder: true

  - stage: Deploy
    displayName: 'Deploy to Production'
    dependsOn: DeployPreProd
    condition: succeeded('DeployPreProd')
    jobs:
      - deployment: DeployApp
        displayName: 'Deploy Application'
        pool:
          name: Default
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Build Artifacts'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'HelloWorld'
                    downloadPath: '$(Pipeline.Workspace)'

                - task: CopyFiles@2
                  displayName: 'Deploy to Target Directory'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/HelloWorld'
                    Contents: '**'
                    TargetFolder: '$(TargetPath)'
                    CleanTargetFolder: true
